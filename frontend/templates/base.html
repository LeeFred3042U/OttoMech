<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="OttoMech — Roadside mechanic on demand">
    <meta name="theme-color" content="#2B1B14">
    <title>{% block title %}OttoMech{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    <header class="app-header">
        <a href="/"><img src="{{ url_for('static', filename='img/oLogo.svg') }}" alt="OttoMech" class="logo-img"></a>
        <nav class="app-nav">
            {% block nav_links %}
            {% endblock %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
    {% block bottom_nav %}{% endblock %}
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
    function handleGoogleCredentialResponse(response, role, dashboardUrl) {
        var credential = response.credential;
        
        fetch('/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: credential, role: role })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.session_token) {
                sessionStorage.setItem('otto_token_handoff', data.session_token);
                sessionStorage.setItem('otto_id_handoff', data.id);
                sessionStorage.setItem('otto_role_handoff', data.role);
                window.location.href = dashboardUrl;
            } else {
                alert(data.error || "Authentication failed");
            }
        })
        .catch(function(e) {
            alert("Network error during Google Auth");
        });
    }
    </script>
</body>
</html>

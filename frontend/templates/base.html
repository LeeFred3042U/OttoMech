<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="OttoMech — Your mechanic. One tap away.">
    <title>{% block title %}OttoMech{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    <header class="app-header">
        <img src="{{ url_for('static', filename='img/oLogo.svg') }}" alt="OttoMech" class="logo-img">
        <p class="tagline">Your mechanic. One tap away.</p>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 GrootForce &middot; CODESLAYER2k25</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>

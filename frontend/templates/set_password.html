{% extends "base.html" %}
{% block title %}Set Password | OttoMech{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-header">
        <p class="auth-eyebrow">Action Required</p>
        <h1>Set your password</h1>
        <p>Choose a secure password to access your account</p>
    </div>

    <form id="set-password-form" novalidate>
        <!-- The token from the URL will be injected here via jinja -->
        <input type="hidden" id="token" name="token" value="{{ token or '' }}">

        <div class="auth-field">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
            <span class="field-error" id="err-password"></span>
        </div>

        <div class="form-error" id="set-password-error" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-set-password">
            <span class="btn-text">Save Password</span>
            <span class="btn-loading" hidden>Saving…</span>
        </button>
    </form>

    <div id="set-password-success" style="display:none; text-align:center; color: var(--text-muted); margin-top: 1rem;">
        Password updated successfully! <a href="/login/user" style="color: var(--text-primary); text-decoration: underline;">Click here to log in</a>.
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('set-password-form');
    const btn = document.getElementById('btn-set-password');
    const errorEl = document.getElementById('set-password-error');
    const successEl = document.getElementById('set-password-success');
    
    // Quick helper to read query params in case Jinja injection isn't used
    const urlParams = new URLSearchParams(window.location.search);
    const tokenInput = document.getElementById('token');
    if (!tokenInput.value) {
        tokenInput.value = urlParams.get('token') || '';
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        
        errorEl.style.display = 'none';
        errorEl.textContent = '';
        
        const pwd = document.getElementById('password').value.trim();
        const token = tokenInput.value;
        
        if (!pwd || pwd.length < 8) {
            errorEl.style.display = 'block';
            errorEl.textContent = 'Password must be at least 8 characters.';
            return;
        }
        
        if (!token) {
            errorEl.style.display = 'block';
            errorEl.textContent = 'Invalid link. Missing token.';
            return;
        }

        btn.disabled = true;
        btn.querySelector('.btn-text').hidden = true;
        btn.querySelector('.btn-loading').hidden = false;

        fetch('/auth/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: pwd }),
        })
        .then(res => res.json().then(body => ({ status: res.status, body })))
        .then(result => {
            btn.disabled = false;
            btn.querySelector('.btn-text').hidden = false;
            btn.querySelector('.btn-loading').hidden = true;
            
            if (result.status === 200) {
                form.style.display = 'none';
                successEl.style.display = 'block';
            } else {
                errorEl.style.display = 'block';
                errorEl.textContent = result.body.error || 'Unknown error';
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.querySelector('.btn-text').hidden = false;
            btn.querySelector('.btn-loading').hidden = true;
            errorEl.style.display = 'block';
            errorEl.textContent = 'Network error. Please try again.';
        });
    });
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Home | OttoMech{% endblock %}

{% block content %}
<div class="landing-container" style="text-align: center; padding: 40px 20px;">
    <h1 style="font-size: 2.5rem; color: #333; margin-bottom: 20px;">Welcome to OttoMech</h1>
    <p style="font-size: 1.2rem; color: #666; margin-bottom: 40px;">The fastest way to get your car fixed. Anywhere, anytime.</p>

    <div class="action-buttons" style="display: flex; flex-direction: column; gap: 16px; align-items: center;">
        <a href="/register/user" style="display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #F5A623, #E6981F); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.1rem; width: 100%; max-width: 300px; box-shadow: 0 4px 15px rgba(245,166,35,0.3); transition: transform 0.2s ease, box-shadow 0.2s ease;">
            🚗 I need a Mechanic
        </a>
        <a href="/login/user" style="display: inline-block; padding: 12px 30px; background: #FFFFFF; color: #F5A623; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 0.95rem; width: 100%; max-width: 300px; border: 2px solid #F5A623; transition: transform 0.2s ease, box-shadow 0.2s ease;">
            Log in as Driver
        </a>
        <a href="/register/mechanic" style="display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #34C759, #2DB84D); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.1rem; width: 100%; max-width: 300px; box-shadow: 0 4px 15px rgba(52,199,89,0.3); transition: transform 0.2s ease, box-shadow 0.2s ease;">
            🔧 I am a Mechanic
        </a>
        <a href="/login/mechanic" style="display: inline-block; padding: 12px 30px; background: #FFFFFF; color: #34C759; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 0.95rem; width: 100%; max-width: 300px; border: 2px solid #34C759; transition: transform 0.2s ease, box-shadow 0.2s ease;">
            Log in as Mechanic
        </a>
    </div>
</div>

<style>
.action-buttons a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
</style>
{% endblock %}

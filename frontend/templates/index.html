{% extends "base.html" %}

{% block title %}Home | OttoMech{% endblock %}

{% block content %}
<div class="landing-container">
    <div class="landing-header">
        <h1>Get help on the road.</h1>
        <p>Find a verified mechanic near you in under 5 minutes.</p>
    </div>

    <div class="role-cards">
        <div class="role-card">
            <div class="role-card-left">
                <span class="role-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H9.3a2 2 0 0 0-1.6.8L5 11l-5.16.86a1 1 0 0 0-.84.99V16h3m10 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m-7 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0"></path></svg></span>
                <div class="role-text">
                    <h2>I need a mechanic</h2>
                    <p>Get roadside help fast</p>
                </div>
            </div>
            <div class="role-card-right">
                <a href="/register/user" class="btn btn-primary">Sign up</a>
                <a href="/login/user" class="btn btn-outline">Log in</a>
            </div>
        </div>

        <div class="role-card">
            <div class="role-card-left">
                <span class="role-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>
                <div class="role-text">
                    <h2>I'm a mechanic</h2>
                    <p>Accept jobs near you</p>
                </div>
            </div>
            <div class="role-card-right">
                <a href="/register/mechanic" class="btn btn-primary">Sign up</a>
                <a href="/login/mechanic" class="btn btn-outline">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
